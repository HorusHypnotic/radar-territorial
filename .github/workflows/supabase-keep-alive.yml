name: Supabase Keep-Alive

# COST_GUARD 2026-09-06:
# Scheduled keep-alive paused while GITHUB-ACTIONS-BUDGET-001 is active.
# Latest scheduled run was failing; preserve manual dispatch for targeted verification.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Consulta Supabase somente leitura
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/supabase_keep_alive.py
